<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Baby Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --cream: #fdf8f0;
      --warm: #f5ece0;
      --blush: #f2c4a0;
      --coral: #e8896a;
      --rust: #c45c3a;
      --sage: #8aab8e;
      --slate: #4a5568;
      --ink: #2d3748;
      --soft: #718096;
      --radius: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); min-height: 100vh; }
    h1, h2, h3 { font-family: 'DM Serif Display', serif; }

    /* ── Header ── */
    header {
      background: var(--warm);
      border-bottom: 1px solid var(--blush);
      padding: 14px 20px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 10;
    }
    .header-left h1 { font-size: 1.3rem; color: var(--rust); line-height: 1; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: none; background: var(--blush);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1rem; transition: background .2s;
    }
    .icon-btn:hover { background: var(--coral); }

    /* ── Stats bar ── */
    .stats-bar {
      display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto;
      scrollbar-width: none; background: var(--warm);
      border-bottom: 1px solid var(--blush);
    }
    .stats-bar::-webkit-scrollbar { display: none; }
    .stat-pill {
      background: #fff; border-radius: 20px; padding: 6px 14px;
      white-space: nowrap; font-size: .78rem; color: var(--slate);
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stat-pill strong { color: var(--rust); }

    /* ── Action bar ── */
    .action-bar { display: flex; gap: 8px; padding: 12px 16px; }
    .btn {
      padding: 8px 16px; border-radius: 8px; border: none;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
      font-size: .85rem; font-weight: 500; transition: all .2s;
    }
    .btn-primary { background: var(--coral); color: #fff; }
    .btn-primary:hover { background: var(--rust); }
    .btn-secondary { background: var(--warm); color: var(--slate); border: 1px solid var(--blush); }
    .btn-secondary:hover { background: var(--blush); }
    .btn-sm { padding: 5px 10px; font-size: .78rem; }
    .btn-danger { background: #fee2e2; color: #b91c1c; }
    .btn-danger:hover { background: #fecaca; }

    /* ── Journal ── */
    main { flex: 1; padding: 16px; }
    .day-group { margin-bottom: 20px; animation: fadeUp .3s ease; }
    .day-header {
      font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--rust);
      padding: 6px 0 4px; border-bottom: 1px solid var(--blush);
      margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline;
    }
    .day-header small { font-family: 'DM Sans', sans-serif; font-size: .75rem; color: var(--soft); }
    .feed-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    .feed-table th {
      text-align: left; padding: 4px 8px; color: var(--soft);
      font-weight: 500; font-size: .75rem; text-transform: uppercase; letter-spacing: .04em;
    }
    .feed-table td { padding: 7px 8px; border-bottom: 1px solid #f0ebe4; vertical-align: middle; }
    .feed-table tr:last-child td { border-bottom: none; }
    .feed-table tr:hover td { background: var(--warm); }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .72rem; font-weight: 500; }
    .badge-for  { background: #e8f5e9; color: #388e3c; }
    .badge-br   { background: #fce7f3; color: #9d174d; }
    .badge-ex   { background: #ede9fe; color: #5b21b6; }
    .badge-mid  { background: #f3f4f6; color: #6b7280; }
    .entry-actions { display: flex; gap: 4px; }
    .row-btn {
      padding: 2px 6px; border-radius: 4px; border: none;
      cursor: pointer; font-size: .72rem; background: var(--warm); color: var(--slate);
    }
    .row-btn:hover { background: var(--blush); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--soft); }
    .empty-state p { font-size: .9rem; margin-top: 8px; }

    /* ── Modals ── */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.35); display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: var(--radius) var(--radius) 0 0;
      padding: 24px 20px 32px; width: 100%; max-width: 520px;
      max-height: 90vh; overflow-y: auto;
      animation: fadeUp .25s ease;
    }
    .modal-handle { width: 40px; height: 4px; background: var(--blush); border-radius: 2px; margin: 0 auto 16px; }
    .modal h3 { font-size: 1.2rem; margin-bottom: 16px; color: var(--rust); }

    /* ── Forms ── */
    .form-row { margin-bottom: 14px; }
    .form-row label { display: block; font-size: .82rem; color: var(--slate); margin-bottom: 4px; }
    .form-row input, .form-row select, .form-row textarea {
      width: 100%; padding: 9px 12px; border-radius: 8px;
      border: 1.5px solid var(--blush); background: var(--cream);
      font-family: 'DM Sans', sans-serif; font-size: .9rem; color: var(--ink);
      outline: none; transition: border-color .2s;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--coral); }
    .form-row textarea { resize: vertical; min-height: 60px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-footer { display: flex; gap: 10px; margin-top: 18px; }
    .form-footer .btn { flex: 1; }

    /* ── Chart ── */
    .chart-wrap { position: relative; height: 220px; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff;
      padding: 10px 20px; border-radius: 24px; font-size: .85rem;
      pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 200;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }

    @keyframes fadeDown { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeUp   { from { opacity:0; transform:translateY(16px);  } to { opacity:1; transform:translateY(0); } }

    @media (max-width: 400px) {
      .feed-table th:nth-child(6), .feed-table td:nth-child(6) { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1 id="header-title">Baby Tracker</h1>
  </div>
  <div class="header-actions">
    <button class="icon-btn" title="Charts" onclick="openModal('modal-chart')">📊</button>
    <button class="icon-btn" title="Data" onclick="openModal('modal-data')">💾</button>
    <button class="icon-btn" title="Settings" onclick="openModal('modal-settings')">⚙️</button>
  </div>
</header>

<div class="stats-bar" id="stats-bar">
  <div class="stat-pill">No entries yet</div>
</div>

<div class="action-bar">
  <button class="btn btn-primary" onclick="openAddForm()">+ Add Entry</button>
</div>

<main id="journal"></main>

<!-- ── Add / Edit modal ── -->
<div class="modal-backdrop" id="modal-add" onclick="backdropClose(event,this)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="form-title">Add Entry</h3>
    <input type="hidden" id="edit-entry-id">
    <div class="form-grid">
      <div class="form-row">
        <label>Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="form-row">
        <label>Time</label>
        <input id="f-time" type="time">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>Type</label>
        <select id="f-type" onchange="toggleMl()">
          <option value="For">Formula (For)</option>
          <option value="Br">Breastfeed (Br)</option>
          <option value="Ex">Express (Ex)</option>
        </select>
      </div>
      <div class="form-row" id="ml-row">
        <label>Amount (ml)</label>
        <input id="f-ml" type="number" min="0" max="500" placeholder="120">
      </div>
    </div>
    <div class="form-row">
      <label>Diaper</label>
      <select id="f-diaper">
        <option value="">—</option>
        <option value="wet">Wet 💧</option>
        <option value="dirty">Dirty 💩</option>
        <option value="both">Both</option>
        <option value="dry">Dry</option>
      </select>
    </div>
    <div class="form-row">
      <label>Notes</label>
      <textarea id="f-notes" placeholder="Any observations…"></textarea>
    </div>
    <div class="form-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-add')">Cancel</button>
      <button class="btn btn-primary" onclick="saveEntry()">Save</button>
    </div>
  </div>
</div>

<!-- ── Data modal ── -->
<div class="modal-backdrop" id="modal-data" onclick="backdropClose(event,this)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Export &amp; Import</h3>
    <p style="font-size:.85rem;color:var(--soft);margin-bottom:16px">
      Export a JSON backup to share with your partner or keep as a backup. Import to restore or merge entries.
    </p>
    <div style="display:flex;gap:10px">
      <button class="btn btn-primary" style="flex:1" onclick="exportJSON()">⬇️ Export JSON</button>
      <button class="btn btn-secondary" style="flex:1" onclick="document.getElementById('import-file').click()">⬆️ Import JSON</button>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importJSON(event)">
    <p style="font-size:.75rem;color:var(--soft);margin-top:12px">
      Import merges entries — duplicates (same date + time) are skipped.
    </p>
  </div>
</div>

<!-- ── Chart modal ── -->
<div class="modal-backdrop" id="modal-chart" onclick="backdropClose(event,this)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Feeding Trends</h3>
    <div style="display:flex;gap:6px;margin-bottom:14px">
      <button class="btn btn-sm btn-secondary" onclick="renderChart(7)">7 days</button>
      <button class="btn btn-sm btn-secondary" onclick="renderChart(14)">14 days</button>
      <button class="btn btn-sm btn-secondary" onclick="renderChart(30)">30 days</button>
    </div>
    <div class="chart-wrap"><canvas id="feed-chart"></canvas></div>
    <p id="chart-note" style="font-size:.75rem;color:var(--soft);margin-top:8px;text-align:center"></p>
  </div>
</div>

<!-- ── Settings modal ── -->
<div class="modal-backdrop" id="modal-settings" onclick="backdropClose(event,this)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3>Settings</h3>
    <div class="form-row">
      <label>Baby's name</label>
      <input id="settings-baby-name" type="text" placeholder="e.g. Lily">
    </div>
    <div class="form-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-settings')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSettings()">Save</button>
    </div>
    <hr style="margin:16px 0;border:none;border-top:1px solid var(--blush)">
    <button class="btn btn-danger btn-sm" onclick="clearAllData()">🗑️ Clear all data</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────
let entries = JSON.parse(localStorage.getItem('bt_entries') || '[]');
let babyName = localStorage.getItem('bt_baby') || 'Baby';
let chartInstance = null;

// ── PERSIST ──────────────────────────────────────────
function save() {
  localStorage.setItem('bt_entries', JSON.stringify(entries));
}

// ── UTILS ────────────────────────────────────────────
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

const TZ = 'Asia/Singapore';

function todayStr() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(new Date());
}

function nowTimeStr() {
  return new Intl.DateTimeFormat('en-GB', { timeZone: TZ, hour:'2-digit', minute:'2-digit', hour12: false }).format(new Date());
}

function dayLabel(dateStr) {
  const today = todayStr();
  const yd = new Date(); yd.setDate(yd.getDate() - 1);
  const yesterday = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(yd);
  if (dateStr === today) return 'Today';
  if (dateStr === yesterday) return 'Yesterday';
  const [y,m,d] = dateStr.split('-');
  return new Date(+y,+m-1,+d).toLocaleDateString('en-SG',{weekday:'short',month:'short',day:'numeric'});
}

// ── RENDER ───────────────────────────────────────────
function render() {
  renderJournal();
  renderStats();
}

function renderJournal() {
  const container = document.getElementById('journal');
  if (!entries.length) {
    container.innerHTML = '<div class="empty-state"><div style="font-size:3rem">🍼</div><p>No entries yet. Tap <strong>+ Add Entry</strong> to start.</p></div>';
    return;
  }

  const sorted = [...entries].sort((a,b) => {
    if (b.date !== a.date) return b.date.localeCompare(a.date);
    return b.time.localeCompare(a.time);
  });

  const grouped = {};
  sorted.forEach(e => { (grouped[e.date] = grouped[e.date] || []).push(e); });

  container.innerHTML = Object.keys(grouped).sort((a,b) => b.localeCompare(a)).map(date => {
    const rows = grouped[date];
    const totalMl = rows.reduce((s,e) => s + (+e.ml||0), 0);
    return `
      <div class="day-group">
        <div class="day-header">
          <span>${dayLabel(date)}</span>
          <small>${totalMl ? totalMl + ' ml total' : ''}</small>
        </div>
        <table class="feed-table">
          <thead><tr><th>#</th><th>Time</th><th>Type</th><th>ml</th><th>Diaper</th><th>Notes</th><th></th></tr></thead>
          <tbody>${rows.map((e, i) => `
            <tr>
              <td style="color:var(--soft)">${i+1}</td>
              <td>${e.time}</td>
              <td>${typeBadge(e.type)}</td>
              <td>${e.ml ? e.ml : '<span style="color:var(--soft)">—</span>'}</td>
              <td>${diaperIcon(e.diaper)}</td>
              <td style="max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft)">${e.notes||''}</td>
              <td><div class="entry-actions">
                <button class="row-btn" onclick="editEntry('${e.id}')">✏️</button>
                <button class="row-btn" onclick="removeEntry('${e.id}')">🗑️</button>
              </div></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
  }).join('');
}

function typeBadge(type) {
  if (type === 'For') return '<span class="badge badge-for">For</span>';
  if (type === 'Br')  return '<span class="badge badge-br">Br</span>';
  if (type === 'Ex')  return '<span class="badge badge-ex">Ex</span>';
  return `<span class="badge badge-mid">${type||'—'}</span>`;
}

function diaperIcon(d) {
  return { wet:'💧', dirty:'💩', both:'💧💩', dry:'✅' }[d] || '<span style="color:var(--soft)">—</span>';
}

function renderStats() {
  const today = entries.filter(e => e.date === todayStr());
  const totalMl = today.reduce((s,e) => s + (+e.ml||0), 0);
  const diapers = today.filter(e => e.diaper && e.diaper !== 'dry').length;
  const last = [...entries].sort((a,b) => b.date.localeCompare(a.date) || b.time.localeCompare(a.time))[0];
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-pill">Today: <strong>${today.length}</strong> feeds</div>
    <div class="stat-pill">Total: <strong>${totalMl} ml</strong></div>
    <div class="stat-pill">Diapers: <strong>${diapers}</strong></div>
    <div class="stat-pill">Last: <strong>${last ? last.time : '—'}</strong></div>
  `;
}

// ── FORM ─────────────────────────────────────────────
function openAddForm() {
  document.getElementById('form-title').textContent = 'Add Entry';
  document.getElementById('edit-entry-id').value = '';
  document.getElementById('f-date').value = todayStr();
  document.getElementById('f-time').value = nowTimeStr();
  document.getElementById('f-type').value = 'For';
  document.getElementById('f-ml').value = '';
  document.getElementById('f-diaper').value = '';
  document.getElementById('f-notes').value = '';
  toggleMl();
  openModal('modal-add');
}

function toggleMl() {
  const isBr = document.getElementById('f-type').value === 'Br';
  document.getElementById('ml-row').style.opacity = isBr ? '.4' : '1';
  document.getElementById('f-ml').disabled = isBr;
}

function editEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!e) return;
  document.getElementById('form-title').textContent = 'Edit Entry';
  document.getElementById('edit-entry-id').value = id;
  document.getElementById('f-date').value = e.date;
  document.getElementById('f-time').value = e.time;
  document.getElementById('f-type').value = e.type;
  document.getElementById('f-ml').value = e.ml || '';
  document.getElementById('f-diaper').value = e.diaper || '';
  document.getElementById('f-notes').value = e.notes || '';
  toggleMl();
  openModal('modal-add');
}

function saveEntry() {
  const id = document.getElementById('edit-entry-id').value;
  const type = document.getElementById('f-type').value;
  const entry = {
    date:   document.getElementById('f-date').value,
    time:   document.getElementById('f-time').value,
    type,
    ml:     type === 'Br' ? null : (parseInt(document.getElementById('f-ml').value) || null),
    diaper: document.getElementById('f-diaper').value,
    notes:  document.getElementById('f-notes').value.trim(),
  };
  if (!entry.date || !entry.time) { toast('Date and time are required'); return; }

  if (id) {
    const idx = entries.findIndex(x => x.id === id);
    if (idx !== -1) entries[idx] = { ...entries[idx], ...entry };
    toast('Entry updated');
  } else {
    entries.push({ id: uid(), createdAt: Date.now(), ...entry });
    toast('Entry saved');
  }
  save();
  render();
  closeModal('modal-add');
}

function removeEntry(id) {
  if (!confirm('Delete this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  save();
  render();
  toast('Deleted');
}

// ── CHART ────────────────────────────────────────────
function renderChart(days) {
  const buckets = {};
  for (let i = 0; i < days; i++) {
    const d = new Date(); d.setDate(d.getDate() - i);
    buckets[new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year:'numeric', month:'2-digit', day:'2-digit' }).format(d)] = 0;
  }
  const cutoff = Object.keys(buckets).sort()[0];
  entries.filter(e => e.date >= cutoff && e.ml)
         .forEach(e => { if (e.date in buckets) buckets[e.date] += (+e.ml||0); });

  const labels = Object.keys(buckets).sort();
  const data = labels.map(k => buckets[k]);

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('feed-chart').getContext('2d'), {
    type: 'bar',
    data: {
      labels: labels.map(l => { const [,m,d] = l.split('-'); return `${m}/${d}`; }),
      datasets: [{ label: 'ml', data, backgroundColor: 'rgba(232,137,106,0.6)', borderColor: '#c45c3a', borderWidth: 1, borderRadius: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, grid: { color: '#f0ebe4' } }, x: { grid: { display: false } } }
    }
  });

  const filled = data.filter(v => v > 0);
  const avg = filled.length ? Math.round(filled.reduce((s,v) => s+v, 0) / filled.length) : 0;
  document.getElementById('chart-note').textContent =
    avg ? `Avg ${avg} ml/day over ${days} days` : 'No ml data in this range';
}

// ── MODALS ───────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.add('open');
  if (id === 'modal-chart') setTimeout(() => renderChart(7), 50);
  if (id === 'modal-settings') document.getElementById('settings-baby-name').value = babyName;
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function backdropClose(e, el) { if (e.target === el) el.classList.remove('open'); }

// ── SETTINGS ─────────────────────────────────────────
function saveSettings() {
  const name = document.getElementById('settings-baby-name').value.trim();
  if (name) {
    babyName = name;
    localStorage.setItem('bt_baby', name);
    document.getElementById('header-title').textContent = name + "'s Tracker";
  }
  closeModal('modal-settings');
  toast('Saved');
}

function clearAllData() {
  if (!confirm('Delete all entries? This cannot be undone.')) return;
  entries = [];
  save();
  render();
  closeModal('modal-settings');
  toast('All data cleared');
}

// ── EXPORT / IMPORT ──────────────────────────────────
function exportJSON() {
  const data = { babyName, exportedAt: new Date().toISOString(), entries };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `baby-tracker-${todayStr()}.json`;
  a.click();
  toast('Exported');
}

async function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = data.entries || data; // support bare arrays too
    if (!Array.isArray(incoming) || !incoming.length) { toast('No entries found'); return; }

    const existingKeys = new Set(entries.map(e => e.date + '|' + e.time));
    let added = 0;
    for (const e of incoming) {
      if (!e.date || !e.time) continue;
      if (existingKeys.has(e.date + '|' + e.time)) continue;
      entries.push({ id: uid(), createdAt: Date.now(), ...e });
      added++;
    }
    save();
    render();
    event.target.value = '';
    toast(`Imported ${added} new entr${added === 1 ? 'y' : 'ies'}`);
  } catch(err) { toast('Import failed: ' + err.message); }
}

// ── TOAST ────────────────────────────────────────────
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── INIT ─────────────────────────────────────────────
document.getElementById('header-title').textContent = babyName + "'s Tracker";
render();
</script>
